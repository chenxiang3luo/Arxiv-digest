# Conda env for the FastAPI backend (same deps as requirements.txt)
name: arxiv-digest
channels:
  - conda-forge
dependencies:
  - python>=3.12,<3.13
  - pip
  - pip:
      - fastapi==0.115.6
      - uvicorn[standard]==0.32.1
      - sqlalchemy==2.0.36
      - pydantic-settings==2.6.1
      - httpx==0.28.1
      - arxiv==2.1.3
      - python-multipart==0.0.17
